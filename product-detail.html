<!DOCTYPE html>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">
                    <img src="VELOCITA.png" alt="Velocita" class="logo-img">
                </a>
            </div>
            <button class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="products.html" class="nav-link">Inventory</a>
                </li>
                <li class="nav-item">
                    <a href="index.html#about" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="index.html#contact" class="nav-link">Contact</a>
                </li>
                <li class="nav-item nav-auth" id="navAuth">
                    <a href="login.html" class="nav-link btn-login">Login</a>
                </li>
                <li class="nav-item nav-auth" id="navSignup">
                    <a href="signup.html" class="nav-link btn-signup">Sign Up</a>
                </li>
                <li class="nav-item nav-user" id="navUser" style="display: none;">
                    <span class="nav-username" id="navUsername"></span>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Product Details Section -->
    <section class="product-detail">
        <div class="container">
            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <i class="fas fa-chevron-right"></i>
                <a href="products.html">Inventory</a>
                <i class="fas fa-chevron-right"></i>
                <span id="breadcrumbCar">Product Details</span>
            </div>
            
            <div class="product-detail-content" id="productDetailContent">
                <!-- Product details will be dynamically loaded -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <img src="VELOCITA.png" alt="Velocita" class="footer-logo">
                    <p class="footer-tagline">Excellence in Motion</p>
                </div>
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products.html">Inventory</a></li>
                        <li><a href="index.html#about">About</a></li>

                </div>
                <div class="footer-section">
                    <h4>Account</h4>
                    <ul>
                        <li><a href="login.html">Login</a></li>
                        <li><a href="signup.html">Sign Up</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 Velocita. All rights reserved.</p>
